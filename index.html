
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b16;
      color: white;
    }

    header {
      background: #15152b;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #6c2cff;
    }

    header h1 {
      color: #9b5cff;
      margin: 0 0 15px;
    }

    input {
      width: 80%;
      max-width: 500px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .game {
      background: #18182b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 15px #000;
    }

    .game h2 { color: #b47cff; }

    button {
      background: #6c2cff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 7px;
      cursor: pointer;
    }

    button:hover {
      background: #8b55ff;
    }
  </style>
</head>
<body>

<header>
  <h1>🎮 GameZone</h1>
  <input type="text" id="search" placeholder="Search games...">
</header>

<section class="games" id="gameList"></section>

<script>
const games = [
  { name: "Space Battle", genre: "Action" },
  { name: "Speed Racer", genre: "Racing" },
  { name: "Zombie Attack", genre: "Adventure" },
  { name: "Puzzle Master", genre: "Puzzle" },
  { name: "Galaxy Wars", genre: "Strategy" },
  { name: "Ninja Run", genre: "Arcade" }
];

const gameList = document.getElementById("gameList");

function displayGames(list) {
  gameList.innerHTML = "";

  list.forEach(game => {
    gameList.innerHTML += `
      <div class="game">
        <h2>${game.name}</h2>
        <p>Genre: ${game.genre}</p>
        <button onclick="playGame('${game.name}')">Play Now</button>
      </div>
    `;
  });
}

function playGame(name) {
  alert("🎮 Starting " + name + "!");
}

document.getElementById("search").addEventListener("input", function() {
  const search = this.value.toLowerCase();

  const filtered = games.filter(game =>
    game.name.toLowerCase().includes(search) ||
    game.genre.toLowerCase().includes(search)
  );

  displayGames(filtered);
});

displayGames(games);
</script>

</body>
</html>
